name: Actualizar y publicar dashboard IEPS

on:
  push:
    branches: [main]
  schedule:
    # UTC: 15:00 = 09:00 en Ciudad de México.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      consulta:
        description: 'Qué ejecutar (publicar usa los datos existentes)'
        required: true
        default: publicar
        type: choice
        options: [publicar, programado, mensual, renuncias, recaudacion]
      fecha:
        description: 'Mensual: fecha de referencia AAAA-MM-DD; vacío = hoy. Consulta el mes anterior.'
        required: false
        type: string
      ano:
        description: 'Renuncias: año de la edición; vacío = año actual.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dashboard-ieps
  cancel-in-progress: false

jobs:
  preparar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TZ: America/Mexico_City
      IEPS_SOLO_DASHBOARD: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Descargar repositorio e histórico
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}
      - name: Organizar automáticamente el proyecto
        run: python3 desplegar.py extraer
      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor_ieps/requirements.txt
      - name: Instalar dependencias
        run: python -m pip install -r monitor_ieps/requirements.txt
      - name: Determinar consultas pendientes
        id: plan
        working-directory: monitor_ieps
        env:
          EVENTO: ${{ github.event_name }}
          CALENDARIO: ${{ github.event.schedule }}
          CONSULTA: ${{ inputs.consulta }}
          FECHA_REFERENCIA: ${{ inputs.fecha }}
          ANO_EDICION: ${{ inputs.ano }}
          SOLO_PLAN: '1'
        run: python src/ejecutar_actualizacion.py
      - name: Preparar navegador para Presto
        if: steps.plan.outputs.presto == 'true'
        run: python -m playwright install --with-deps chromium
      - name: Verificar cálculos y calendario
        working-directory: monitor_ieps
        run: python -m unittest discover -s tests -v
      - name: Consultar, validar y regenerar
        env:
          EVENTO: ${{ github.event_name }}
          CALENDARIO: ${{ github.event.schedule }}
          CONSULTA: ${{ inputs.consulta }}
          FECHA_REFERENCIA: ${{ inputs.fecha }}
          ANO_EDICION: ${{ inputs.ano }}
        working-directory: monitor_ieps
        run: python src/ejecutar_actualizacion.py
      - name: Guardar datos validados en GitHub
        env:
          RAMA: ${{ github.event.repository.default_branch }}
        run: |
          python desplegar.py guardar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git add -f monitor_ieps_base.zip
          if git diff --cached --quiet; then
            echo 'Sin cambios en la base o el dashboard.'
          else
            git commit -m 'Actualizar dashboard IEPS con datos validados'
            git push origin "HEAD:$RAMA"
          fi
      - name: Empaquetar únicamente el dashboard público
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll
      - name: Preparar archivo para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - name: Conservar diagnóstico de Presto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-presto
          path: monitor_ieps/diagnostico_presto/
          if-no-files-found: ignore
          retention-days: 14
      - name: Mostrar falla de ejecución
        if: failure()
        run: |
          echo '## Actualización no completada' >> "$GITHUB_STEP_SUMMARY"
          echo 'Revisar el paso que falló. Las consultas sin datos se reintentan y publican un aviso. Las fallas de ejecución requieren revisar Actions. El dashboard publicado anteriormente sigue disponible.' >> "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5
      - name: Publicar dashboard
        id: deployment
        uses: actions/deploy-pages@v4
