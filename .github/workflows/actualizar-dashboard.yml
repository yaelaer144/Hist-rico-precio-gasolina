name: Actualizar y publicar dashboard IEPS

on:
  push:
    branches: [main]
  schedule:
    # 09:00 en Ciudad de México.
    - cron: '0 15 * * *'
  workflow_dispatch:
    inputs:
      consulta:
        description: 'Qué ejecutar (publicar usa los datos existentes)'
        required: true
        default: publicar
        type: choice
        options: [publicar, programado, mensual, renuncias, recaudacion]
      fecha:
        description: 'Mensual: fecha AAAA-MM-DD; vacío = hoy. Consulta el mes anterior.'
        required: false
        type: string
      ano:
        description: 'Renuncias: año de la edición; vacío = año actual.'
        required: false
        type: string

permissions:
  contents: read

concurrency:
  group: dashboard-ieps
  cancel-in-progress: false

jobs:
  preparar:
    if: github.ref == format('refs/heads/{0}', github.event.repository.default_branch)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: write
    env:
      TZ: America/Mexico_City
      IEPS_SOLO_DASHBOARD: '1'
      PYTHONUNBUFFERED: '1'
    steps:
      - name: Descargar repositorio e histórico
        uses: actions/checkout@v6
        with:
          ref: ${{ github.event.repository.default_branch }}

      - name: Organizar automáticamente el proyecto
        run: python3 desplegar.py extraer
        
      - name: Corregir descarga y lectura CNE
        run: python3 corregir_cne.py

      - name: Preparar Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: monitor_ieps/requirements.txt

      - name: Instalar dependencias
        run: python -m pip install -r monitor_ieps/requirements.txt

      - name: Habilitar nueva consulta mensual manual
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.consulta == 'mensual' }}
        env:
          FECHA_REFERENCIA: ${{ inputs.fecha }}
        run: |
          python3 - <<'PY'
          import json
          import os
          import datetime as dt
          from pathlib import Path

          archivo = Path("monitor_ieps/data/estado_actualizacion.json")

          if not archivo.exists():
              print("Sin estado previo; se creara la tarea mensual.")
          else:
              estado = json.loads(archivo.read_text(encoding="utf-8"))

              fecha = dt.date.fromisoformat(
                  os.environ.get("FECHA_REFERENCIA")
                  or dt.date.today().isoformat()
              )

              anterior = fecha.replace(day=1) - dt.timedelta(days=1)
              clave = "mensual:" + anterior.strftime("%Y-%m")
              tarea = estado.get("tareas", {}).get(clave)

              if tarea is not None:
                  tarea["estado"] = "pendiente"
                  tarea.pop("ultimo_intento", None)

                  archivo.write_text(
                      json.dumps(estado, ensure_ascii=False, indent=2),
                      encoding="utf-8"
                  )

                  print("Reintento habilitado:", clave)
              else:
                  print("Se creara una nueva tarea:", clave)
          PY

      - name: Determinar consultas pendientes
        id: plan
        working-directory: monitor_ieps
        env:
          EVENTO: ${{ github.event_name }}
          CALENDARIO: ${{ github.event.schedule }}
          CONSULTA: ${{ inputs.consulta }}
          FECHA_REFERENCIA: ${{ inputs.fecha }}
          ANO_EDICION: ${{ inputs.ano }}
          SOLO_PLAN: '1'
        run: python src/ejecutar_actualizacion.py

      - name: Preparar navegador para Presto
        if: steps.plan.outputs.presto == 'true'
        run: python -m playwright install --with-deps chromium

      - name: Verificar cálculos y calendario
        working-directory: monitor_ieps
        run: python -m unittest discover -s tests -v

      - name: Consultar, validar y regenerar
        working-directory: monitor_ieps
        env:
          EVENTO: ${{ github.event_name }}
          CALENDARIO: ${{ github.event.schedule }}
          CONSULTA: ${{ inputs.consulta }}
          FECHA_REFERENCIA: ${{ inputs.fecha }}
          ANO_EDICION: ${{ inputs.ano }}
        run: python src/ejecutar_actualizacion.py
        
      - name: Sincronizar precios CNE automáticamente
        run: |
          python3 sincronizar_cne.py
          cd monitor_ieps
          python src/generar_index.py
          python src/agregar_recaudacion.py
          python src/agregar_recaudacion_mensual.py
          python src/ajustes_graficas.py

      - name: Sincronizar precios CNE automáticamente
        run: |
          python3 sincronizar_cne.py
          cd monitor_ieps
          python src/generar_index.py
          python src/agregar_recaudacion.py
          python src/agregar_recaudacion_mensual.py
          python src/ajustes_graficas.py
          
      - name: Copiar dashboard actualizado
        run: |
          cp monitor_ieps/index.html index.html
          echo "HTML actualizado copiado a la raíz"
          
      - name: Guardar datos validados en GitHub
        env:
          RAMA: ${{ github.event.repository.default_branch }}
        run: |
          python desplegar.py guardar
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git add -f monitor_ieps_base.zip
          if git diff --cached --quiet; then
            echo 'Sin cambios en la base o el dashboard.'
          else
            git commit -m 'Actualizar dashboard IEPS con datos validados'
            git push origin "HEAD:$RAMA"
          fi

      - name: Empaquetar únicamente el dashboard público
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          touch _site/.nojekyll

      - name: Preparar archivo para GitHub Pages
        uses: actions/upload-pages-artifact@v4
        with:
          path: _site

      - name: Conservar diagnóstico de Presto
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: diagnostico-presto
          path: monitor_ieps/diagnostico_presto/
          if-no-files-found: ignore
          retention-days: 14

      - name: Mostrar falla de ejecución
        if: failure()
        run: |
          echo '## Actualización no completada' >> "$GITHUB_STEP_SUMMARY"
          echo 'Revisar el paso que falló. Las consultas sin datos se reintentan y publican un aviso. Las fallas de ejecución requieren revisar Actions. El dashboard publicado anteriormente sigue disponible.' >> "$GITHUB_STEP_SUMMARY"

  publicar:
    needs: preparar
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Configurar Pages
        uses: actions/configure-pages@v5

      - name: Publicar dashboard
        id: deployment
        uses: actions/deploy-pages@v4
